# Separate evidence store. Does not add Object Lock to the LZA central logs bucket.
AWSTemplateFormatVersion: '2010-09-09'
Description: Retained, encrypted evidence bucket with compliance-mode Object Lock
Parameters:
  RetentionDays:
    Type: Number
    Default: 2555
    MinValue: 1
    Description: Customer-approved retention, not a fixed CMMC requirement
Resources:
  EvidenceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      Description: CMMC evidence encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamDelegation
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days:
              Ref: RetentionDays
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::GetAtt: [EvidenceKey, Arn]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt: [EvidenceBucket, Arn]
              - Fn::Sub: ${EvidenceBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  BucketName:
    Value:
      Ref: EvidenceBucket
  KmsKeyArn:
    Value:
      Fn::GetAtt: [EvidenceKey, Arn]
