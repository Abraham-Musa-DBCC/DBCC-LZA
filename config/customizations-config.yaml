# Creates an additional evidence bucket, not an immutable replacement for the LZA central log bucket. Evidence export jobs and scoped reader/writer permissions remain to be configured.
customizations:
  cloudFormationStacks:
  - name: CMMC-EvidenceStore
    description: Separate protected evidence store; does not lock LZA log buckets
    deploymentTargets:
      accounts:
      - LogArchive
    regions:
    - us-gov-west-1
    runOrder: 1
    template: cloudformation/evidence-store.yaml
    terminationProtection: true
    parameters:
    - name: RetentionDays
      value: '2555'
  - name: CMMC-SecurityHub
    description: Security Hub finding export, alerting and CMMC insights in the delegated
      admin account; complements LZA native securityHub config
    deploymentTargets:
      accounts:
      - Audit
    regions:
    - us-gov-west-1
    runOrder: 2
    template: cloudformation/security-hub.yaml
    terminationProtection: true
    parameters:
    - name: RetentionDays
      value: '2555'
    - name: NotificationEmailAddress
      value: REPLACE-security-operations@example.invalid
