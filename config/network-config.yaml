    value: SecurityProtection
vpcFlowLogs:
  trafficType: ALL
  maxAggregationInterval: 60
  destinations:
  - s3
  defaultFormat: true
  customFields: []
centralNetworkServices:
  delegatedAdminAccount: Network
  route53Resolver:
    queryLogs:
      name: CMMC-DnsQueries
      destinations:
      - s3
      shareTargets:
        organizationalUnits:
        - CUI-Production
        - CUI-Development
        - Infrastructure
