# CIDRs/AZ letters are examples. VPCs interconnected via Transit Gateway in the Network account, with local endpoints. NO internet/hybrid/inspection routes. Add approved connectivity before workloads need external updates. Default VPC deletion needs an inventory review first.
homeRegion: us-gov-west-1
defaultVpc:
  delete: true
  excludeAccounts: []
endpointPolicies:
- name: AccountOnly
  document: endpoint-policies/account-only.json
- name: BootstrapS3
  document: endpoint-policies/s3-bootstrap.json
transitGateways:
- name: CMMC-TGW
  account: Network
  region: us-gov-west-1
  asn: 64512
  dnsSupport: enable
  vpnEcmpSupport: enable
  defaultRouteTableAssociation: disable
  defaultRouteTablePropagation: disable
  autoAcceptSharingAttachments: enable
  shareTargets:
    organizationalUnits:
    - CUI-Production
    - CUI-Development
    - Infrastructure
  routeTables:
  - name: CMMC-TGW-Shared
    routes: []
  transitGatewayFlowLogs:
    maxAggregationInterval: 60
    destinations:
    - s3
    defaultFormat: true
    customFields: []
  tags:
  - key: DataClassification
    value: SecurityProtection
vpcs:
- name: CUIProd-Private
  account: CUIProd
  region: us-gov-west-1
  cidrs:
  - 10.40.0.0/16
  internetGateway: false
  enableDnsHostnames: true
  enableDnsSupport: true
  defaultSecurityGroupRulesDeletion: true
  routeTables:
  - name: Private-A
    routes:
    - name: S3Gateway
      type: gatewayEndpoint
      target: s3
    - name: ToCUIDev
      destination: 10.41.0.0/16
      type: transitGateway
      target: CMMC-TGW-CUIProd-Attach
    - name: ToSharedServices
      destination: 10.42.0.0/16
      type: transitGateway
      target: CMMC-TGW-CUIProd-Attach
  - name: Private-B
    routes:
    - name: S3Gateway
      type: gatewayEndpoint
      target: s3
    - name: ToCUIDev
      destination: 10.41.0.0/16
      type: transitGateway
      target: CMMC-TGW-CUIProd-Attach
    - name: ToSharedServices
      destination: 10.42.0.0/16
      type: transitGateway
      target: CMMC-TGW-CUIProd-Attach
  subnets:
  - name: Private-A
    availabilityZone: a
    ipv4CidrBlock: 10.40.0.0/24
    routeTable: Private-A
    mapPublicIpOnLaunch: false
  - name: Private-B
    availabilityZone: b
    ipv4CidrBlock: 10.40.1.0/24
    routeTable: Private-B
    mapPublicIpOnLaunch: false
  gatewayEndpoints:
    defaultPolicy: BootstrapS3
    endpoints:
    - service: s3
  interfaceEndpoints:
    central: false
    defaultPolicy: AccountOnly
    allowedCidrs:
    - 10.40.0.0/16
    subnets:
    - Private-A
    - Private-B
    endpoints:
    - service: ssm
    - service: ssmmessages
    - service: ec2messages
    - service: logs
    - service: monitoring
    - service: kms
    - service: secretsmanager
    - service: sts
    - service: ec2
  transitGatewayAttachments:
  - name: CMMC-TGW-CUIProd-Attach
    transitGateway:
      name: CMMC-TGW
      account: Network
    subnets:
    - Private-A
    - Private-B
    routeTableAssociations:
    - CMMC-TGW-Shared
    routeTablePropagations:
    - CMMC-TGW-Shared
    options:
      dnsSupport: enable
  queryLogs:
  - CMMC-DnsQueries
  tags:
  - key: DataClassification
    value: CUI
